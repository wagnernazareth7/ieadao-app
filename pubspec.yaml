name: ieadao
description: Aplicativo de gestão da Igreja IEADAO
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10

  # Supabase
  supabase_flutter: ^2.12.0

  # Riverpod
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^12.1.3

  # UI, Charts & Reports
  cached_network_image: ^3.2.3
  fl_chart: ^0.66.0
  pdf: ^3.10.6
  printing: ^5.12.0
  excel: ^4.0.2
  google_fonts: ^6.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Audio & Media
  just_audio: ^0.9.36
  audio_video_progress_bar: ^2.0.1

  # Calendar & Notifications
  add_2_calendar: ^3.0.1

  # Connectivity (ADICIONADO)
  connectivity_plus: ^6.1.3

  # Utils
  shared_preferences: ^2.2.1
  path_provider: ^2.1.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.2.0
  share_plus: ^7.2.2
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.6
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - .env
